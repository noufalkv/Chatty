name: CI/CD

on:
  push:
    branches: [main, feature/cicd]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [chatty, chatty-backend]
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: cd ${{ matrix.service }} && npm ci

      - name: Run ESLint
        run: cd ${{ matrix.service }} && npx eslint .

      - name: Run Prettier check
        run: cd ${{ matrix.service }} && npx prettier --check .

      - name: Run tests
        run: cd ${{ matrix.service }} && npm test

      - name: Build Docker image
  run: docker build -t noufalkv/${{ matrix.service }}:${{ github.sha }} ${{ matrix.service }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
  run: docker push noufalkv/${{ matrix.service }}:${{ github.sha }}
